<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${htmlLang}" th:dir="${htmlDir}">
<head>
<link rel="icon" type="image/png" th:href="@{/favicon.png}"/>
<title th:text="#{ui.ws.title} + ' — MyPlus'">Where to work — MyPlus</title>
<th:block th:replace="~{fragments/header :: header-css}"></th:block>
<style>
  /* RW-3 — the tile home: one tile per workspace the person has (auth-service rows, V27). */
  .ws-home { max-width: 960px; margin: 32px auto; padding: 0 16px; }
  .ws-home h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 4px; }
  .ws-home p.ws-lede { color: #5b6472; margin: 0 0 24px; }
  .ws-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .ws-tile { display: flex; flex-direction: column; gap: 10px; padding: 20px; border-radius: 12px; background: #fff;
             border: 1px solid #dde3ec; color: #0d2353; text-decoration: none; box-shadow: 0 1px 2px rgba(13,35,83,.06); }
  .ws-tile:hover, .ws-tile:focus { border-color: #1565C0; box-shadow: 0 4px 14px rgba(21,101,192,.14); text-decoration: none; }
  .ws-tile .glyphicon { font-size: 24px; color: #1565C0; }
  .ws-tile b { font-size: 1.05rem; }
  .ws-empty { color: #5b6472; }
</style>
</head>
<body>
  <div id="container">
    <th:block th:replace="~{fragments/header :: header}" />
    <main class="ws-home">
      <h1 th:text="#{ui.ws.title}">Where to work</h1>
      <p class="ws-lede" th:text="#{ui.ws.lede}">You have more than one job here. Choose one — you can switch any time from the top bar.</p>
      <div class="ws-grid" id="wsTiles">
        <a th:each="w : ${list}" class="ws-tile" th:href="@{${w.url}}" th:attr="data-ws=${w.key}">
          <span th:class="'glyphicon glyphicon-' + ${w.icon != null ? w.icon : 'th-large'}" aria-hidden="true"></span>
          <b th:text="${#messages.msgOrNull(w.label) != null ? #messages.msg(w.label) : w.key}">Workspace</b>
        </a>
      </div>
      <p class="ws-empty" th:if="${#lists.isEmpty(list)}">
        <span th:text="#{ui.ws.none}">No workspace is set up for your role.</span>
        <a th:href="@{/dashboard}" th:text="#{ui.ws.home}">Go to the dashboard</a>
      </p>
    </main>
  </div>
  <th:block th:replace="~{fragments/header :: header-js}"></th:block>
  <script th:src="@{/js/common/sessions.js}"></script>
</body>
</html>
