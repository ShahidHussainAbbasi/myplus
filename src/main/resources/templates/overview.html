<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${htmlLang}" th:dir="${htmlDir}">
<head>
<link rel="icon" type="image/png" th:href="@{/favicon.png}"/>
<title th:text="#{ui.ov.title} + ' — MyPlus'">Today at a glance — MyPlus</title>
<th:block th:replace="~{fragments/header :: header-css}"></th:block>
<link rel="stylesheet" th:href="@{/css/overview.css}"/>
</head>
<body>
  <div id="container">
    <th:block th:replace="~{fragments/header :: header}" />
    <main class="ov-home">
      <h1 th:text="#{ui.ov.title}">Today at a glance</h1>
      <p class="ov-date" id="ovDate">&nbsp;</p>
      <div class="ov-grid">
        <!-- HC-1b: the clinic's three cards are shared with the Clinic home (fragments/clinic-today.html). -->
        <th:block th:replace="~{fragments/clinic-today :: cards}"></th:block>
        <a th:if="${@perm.menu('overview.prescriptions')}" class="ov-card" id="ovRxCard" th:href="@{/businessDashboard}">
          <span class="ov-label" th:text="#{ui.ov.rx}">Prescriptions waiting</span>
          <span class="ov-value" id="ovRx">—</span>
        </a>
        <a th:if="${@perm.menu('overview.takings')}" class="ov-card" id="ovTakingsCard" th:href="@{/businessDashboard}">
          <span class="ov-label" th:text="#{ui.ov.takings}">Takings today</span>
          <span class="ov-value" id="ovTakings">—</span>
          <span class="ov-sub" id="ovSales" th:attr="data-tpl=#{ui.ov.sales}"></span>
        </a>
      </div>
    </main>
  </div>
  <th:block th:replace="~{fragments/header :: header-js}"></th:block>
  <script th:src="@{/js/common/sessions.js}"></script>
  <script th:inline="javascript">var serverContext = [[@{/}]];</script>
  <script th:src="@{/js/common/overview.js}"></script>
</body>
</html>
