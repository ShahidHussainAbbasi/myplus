<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:with="isRtl=${#locale.language == 'ar' or #locale.language == 'ur'}"
      th:lang="${#locale.language}" th:dir="${isRtl} ? 'rtl' : 'ltr'">
<head>
<meta charset="UTF-8"/>
<!-- Mobile-first, deliberately: a guardian checks one thing, on a phone, standing up. -->
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title th:text="#{ui.guardianPortal}">Guardian Portal</title>
<th:block th:replace="~{fragments/header :: header-css}"></th:block>
<style>
/* Slice 3.1 — a SEPARATE page, not the staff dashboard with things hidden.
   Guardians are not staff: no sidebar, no module switcher, no nav they have no business seeing.
   Hiding staff chrome with CSS would leave it one inspector-click away; not rendering it is the point.

   NAMING: the file follows the platform's <audience>Dashboard.html convention (business, education,
   welfare, agriculture, appointment) and uses GUARDIAN, which is the domain entity — Student.guardianId,
   GuardianPortalAccess. The visible title stays "Guardian Portal" because that is what a guardian calls
   themselves; the split between the internal domain term and the human-facing one is deliberate. */
body{background:#f4f6fb;margin:0}
.pp-wrap{max-width:760px;margin:0 auto;padding:16px 14px 48px}
.pp-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.pp-title{margin:0;font-size:20px;font-weight:800;color:#0D2353}
.pp-sub{font-size:13px;color:#64748b;margin-top:2px}
.pp-card{background:#fff;border:1px solid #e8edf5;border-radius:12px;padding:14px 16px;margin-bottom:12px;
         box-shadow:0 1px 3px rgba(13,35,83,.05)}
.pp-card h5{margin:0 0 10px;font-size:14px;font-weight:700;color:#0D2353;text-transform:uppercase;
            letter-spacing:.04em}
.pp-kids{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pp-kid{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:7px 16px;font-size:14px;
        font-weight:600;color:#334155;cursor:pointer}
.pp-kid.on{background:#1565C0;border-color:#1565C0;color:#fff}
.pp-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #f1f5f9;
        font-size:14px}
.pp-row:last-child{border-bottom:0}
.pp-muted{color:#64748b}
.pp-big{font-size:26px;font-weight:800;color:#0D2353}
.pp-due{color:#b91c1c}
.pp-empty{color:#64748b;font-size:13.5px;padding:6px 0}
.pp-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.pp-tab{border:0;background:#e8edf5;border-radius:8px;padding:8px 14px;font-size:13.5px;font-weight:600;
        color:#334155;cursor:pointer;white-space:nowrap}
.pp-tab.on{background:#0D2353;color:#fff}
@media (max-width:480px){ .pp-wrap{padding:12px 10px 40px} .pp-title{font-size:18px} }
</style>
</head>
<body>
<div class="pp-wrap">
  <div class="pp-head">
    <div>
      <h1 class="pp-title" th:text="#{ui.guardianPortal}">Guardian Portal</h1>
      <div class="pp-sub" id="ppWho"></div>
    </div>
    <a th:href="@{/logout}" class="pp-tab" th:text="#{label.pages.logout}">Logout</a>
  </div>

  <!-- Every failure mode — portal off, no access, revoked — renders identically. A guardian must not be
       able to tell "you are not a guardian" from "that school has the portal switched off". -->
  <div id="ppNoAccess" class="pp-card" style="display:none">
    <div class="pp-empty" th:text="#{ui.portalNoAccess}">This portal is not available for your account. Please contact the school.</div>
  </div>

  <div id="ppMain" style="display:none">
    <div class="pp-kids" id="ppChildren"></div>

    <div class="pp-tabs">
      <button type="button" class="pp-tab on" data-tab="results" th:text="#{ui.results}">Results</button>
      <button type="button" class="pp-tab" data-tab="notices" th:text="#{ui.notices}">Notices</button>
      <button type="button" class="pp-tab" data-tab="meetings" th:text="#{ui.meetings}">Meetings</button>
      <button type="button" class="pp-tab" data-tab="attendance" th:text="#{ui.attendance}">Attendance</button>
      <button type="button" class="pp-tab" data-tab="dues" th:text="#{ui.fees}">Fees</button>
      <button type="button" class="pp-tab" data-tab="homework" th:text="#{ui.homework}">Homework</button>
    </div>

    <div id="ppResults" class="pp-panel"></div>
    <!-- Slice 3.5 — notices are NOT per-child: they are addressed to the guardian or the whole school,
         so this panel sits outside the child picker's effect entirely. -->
    <div id="ppNotices" class="pp-panel" style="display:none"></div>
    <!-- Slice edu-3.4 — the only place on the portal a guardian WRITES anything. Like notices, it is not
         per-child: a meeting is between the school and the guardian. -->
    <div id="ppMeetings" class="pp-panel" style="display:none"></div>
    <div id="ppAttendance" class="pp-panel" style="display:none"></div>
    <div id="ppDues" class="pp-panel" style="display:none"></div>
    <div id="ppHomework" class="pp-panel" style="display:none"></div>
  </div>
</div>

<script th:inline="javascript">var serverContext = [[@{/}]];</script>
<th:block th:replace="~{fragments/header :: header-js}"></th:block>
<script th:src="@{/js/common/dom-safe.js}"></script>
<script th:src="@{/js/education/guardian.js}"></script>
</body>
</html>
