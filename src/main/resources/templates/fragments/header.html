<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <th:block th:fragment="header-css">
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
        <!-- Script webfont for languages Inter does not cover (Arabic, Urdu, Devanagari). Without it
             the UI falls back to whatever the OS has — often a mismatched serif, sometimes boxes.
             Each language declares its OWN font (SupportedLanguage.getWebfont), so exactly one family
             is fetched and Latin-script visitors download nothing extra. Keyed on the font rather than
             on direction because Hindi is left-to-right but still needs one. -->
        <link th:if="${langWebfont}" rel="stylesheet"
              th:href="'https://fonts.googleapis.com/css2?family=' + ${langWebfont} + '&display=swap'"/>
        <link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.min.css}">
        <link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap-datepicker.min.css}">
        <link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap-select.min.css}"/>
        <link rel="stylesheet" th:href="@{/css/jquery.dataTables.min.css}">
        <link rel="stylesheet" th:href="@{/css/buttons.dataTables.min.css}">
        <link rel="stylesheet" th:href="@{/css/application.css}"/>
        <link rel="stylesheet" th:href="@{/main.css}"/>
        <link rel="stylesheet" th:href="@{/css/theme.css}"/>
        <link rel="stylesheet" th:href="@{/css/crud-modal.css}"/>
        <!-- POS line-entry row (design P1). Every rule is scoped to .pos-rowentry, which
             loadPosFeatureFlags() puts on #sellDiv only when pos.keyboard.enabled is ON —
             so with the flag off this file matches nothing and the sell screen is unchanged. -->
        <link rel="stylesheet" th:href="@{/css/pos-rowentry.css}"/>
        <!-- Configuration screen (all four dashboards) + the Document Designer. Both are scoped:
             .cfg-* and #DocumentDesignerDiv. -->
        <link rel="stylesheet" th:href="@{/css/settings-form.css}"/>
        <link rel="stylesheet" th:href="@{/css/team-picker.css}"/>
        <link rel="stylesheet" th:href="@{/css/jquery.timepicker.min.css}"/>
        <!-- The app's own date/datetime calendar (see /js/common/date-picker.js) — no third-party picker. -->
        <link rel="stylesheet" th:href="@{/css/date-picker.css}"/>
        <!-- The one responsive contract (767/991/1199) for every dashboard. Loaded LAST so it settles
             disagreements between theme.css, sidebar.css and crud-modal.css instead of adding a fourth. -->
        <link rel="stylesheet" th:href="@{/css/responsive.css}"/>
        <link rel="stylesheet" th:href="@{/css/lang-switcher.css}"/>
        <!-- RTL corrections for Arabic/Urdu. After responsive.css so it wins, and only for RTL
             locales so an LTR page neither downloads nor evaluates it. -->
        <link th:if="${isRtl}" rel="stylesheet" th:href="@{/css/rtl.css}"/>
        <!-- Slice 1.5: paper rules for every screen (report cards are the first real consumer). Last, and
             media-scoped, so it can only ever affect printing. -->
        <link rel="stylesheet" media="print" th:href="@{/css/print.css}"/>
    </th:block>

    <th:block th:fragment="header-js">
        <!-- Translated strings for the module scripts, from the SAME bundle Thymeleaf renders the
             markup with (see JsMessageSource + LocaleInterceptor). th:inline="javascript" escapes
             the values, so translated copy cannot inject script. Must precede i18n.js. -->
        <script th:inline="javascript">/*<![CDATA[*/
            window.__MSG = /*[[${jsMessages}]]*/ {};
        /*]]>*/</script>
        <script th:src="@{/js/common/i18n.js}"></script>
        <!-- PERF-3 (microservices/docs/frontend-performance-audit.md, finding F4).
             This was TWO jQuery tags:
                 /js/jquery.min.js      — jQuery 1.11.2, 96KB
                 /js/jquery-3.3.1.js    — jQuery 3.3.1, 282KB, the UNMINIFIED development build
             1.11.2 loaded and was then immediately overwritten by 3.3.1 on the very next line, with no
             code in between to observe it — so the app has always in fact run on 3.3.1 and dropping the
             1.x tag is a no-op behaviourally, not a version upgrade. Every plugin below loads AFTER this
             line and therefore already bound to 3.3.1.
             The remaining tag now points at the minified build that was already sitting unused in the
             same directory. Same library, same version, 282KB -> 87KB.
             NOTE: /js/jquery.min.js is still on disk on purpose — appointment.html loads it directly. -->
        <script th:src="@{/js/jquery-3.3.1.min.js}"></script>
        <script th:src="@{/js/moment.js}"></script>
        <script th:src="@{/js/jquery.timepicker.min.js}"></script>
        <script th:src="@{/js/jquery.dataTables.min.js}"></script>
        <script th:src="@{/bootstrap/js/bootstrap-datetimepicker.js}"></script>
        <script th:src="@{/bootstrap/js/bootstrap-select.min.js}"></script>
        <script th:src="@{/jQExp/dataTables.buttons.min.js}"></script>
        <!-- Rows-per-page for every grid. AFTER jquery.dataTables (it extends its defaults) and BEFORE any
             module script builds a table (defaults are read at construction, so later would be inert). -->
        <script th:src="@{/js/common/datatable-defaults.js}"></script>
        <script th:src="@{/jQExp/buttons.flash.min.js}"></script>
        <!-- PERF-4b: jszip.min.js, pdfmake.min.js and vfs_fonts.js NO LONGER LOAD HERE.
             They were 2,121,616 bytes raw / 932,627 gzipped — after PERF-1 that was ~70% of the compressed
             JS on every dashboard — and they serve exactly two buttons (Excel, PDF) that most sessions
             never press. js/common/lazy-export.js now fetches them on FIRST CLICK instead.
             csv / copy / print need no library at all and are unaffected.
             ⚠️ Do NOT "fix" a missing export button by re-adding these tags: DataTables hides pdfHtml5 and
             excelHtml5 when their library is absent AT TABLE INIT, which is exactly why lazy-export.js
             declares them as custom buttons instead. Re-adding these would mask that mechanism and
             silently restore the ~900KB. -->
        <script th:src="@{/jQExp/buttons.html5.min.js}"></script>
        <script th:src="@{/jQExp/buttons.print.min.js}"></script>
        <script th:src="@{/bootstrap/js/bootstrap.min.js}"></script>
        <script th:src="@{/bootstrap/js/bootstrap-datepicker.min.js}"></script>
        <script th:src="@{/js/main.js}"></script>
        <!-- PERF-2: the ONE hole content-hash versioning cannot close by itself.
             Every asset URL in this app is a Thymeleaf @{...} link, and ResourceUrlEncodingFilter rewrites
             those to /js/name-<md5>.js automatically — 228 links, zero template edits. But lazy-export.js
             builds its three URLs in JavaScript at click time, where no filter can reach them, so they
             would be requested unhashed: correct bytes, but served under an `immutable` one-year header
             with no way to bust them on the next deploy.
             Resolving them HERE, through @{...}, hands the resolver's own answer to the script. The
             literal paths stay in lazy-export.js as a fallback, so nothing breaks if this block is
             missing — it just loses the versioning. -->
        <script th:inline="javascript">/*<![CDATA[*/
            window.__ASSETS = {
                pdfmake:  /*[[@{/jQExp/pdfmake.min.js}]]*/ '/jQExp/pdfmake.min.js',
                vfsFonts: /*[[@{/jQExp/vfs_fonts.js}]]*/   '/jQExp/vfs_fonts.js',
                jszip:    /*[[@{/jQExp/jszip.min.js}]]*/   '/jQExp/jszip.min.js'
            };
        /*]]>*/</script>
        <!-- PERF-4b: lazyPdfButton() / lazyExcelButton() for DataTables. Must load BEFORE the module
             scripts (business.js / education.js / agriculture.js) that call them while building tables. -->
        <script th:src="@{/js/common/lazy-export.js}"></script>
        <!-- Global AJAX waiting overlay — one source for the whole app; blocks interaction while any
             $.ajax/$.post is in flight (see /js/common/ajax-overlay.js). -->
        <script th:src="@{/js/common/ajax-overlay.js}"></script>
        <!-- App-themed confirm/prompt/alert (uiConfirm/uiPromptConfirm/uiAlert) — replaces the browser's
             unstyled window.confirm. Must load before the module scripts that call it. -->
        <script th:src="@{/js/common/confirm-dialog.js}"></script>
        <!-- C3: ask the SERVER what this tenant may do, and hide the sections it may not. Supersedes the
             hardcoded client-side VERTICALS map in module-theme.js as the source of that decision. Renders
             only — the refusal that matters lives on the write paths (CapabilityService.assertEnabled). -->
        <script th:src="@{/js/common/capabilities.js}"></script>
        <!-- Contact-360 (cross-module contact view) — shared by business/education/welfare/pharmacy rows. -->
        <script th:src="@{/js/common/party-contact.js}"></script>
        <!-- Focus flow: on these long dashboards, bring a revealed section / opened record / rejected field
             into view and land the cursor in it, so nobody hunts and scrolls. Desktop-only auto-focus. -->
        <script th:src="@{/js/common/focus-flow.js}"></script>
        <!-- Date pickers: the app's own calendar, bound in ONE place (binding a second plugin to the same input
             is what cleared fields on blur). Zero dependencies — nothing to vendor. Emits exactly the
             dd-MM-yyyy / dd-MM-yyyy HH:mm:ss / dd-MMM-yyyy / MM-yyyy strings the services already parse. -->
        <script th:src="@{/js/common/date-picker.js}"></script>
        <!-- Demo free-trial: surfaces the gateway's DEMO_LIMIT (50/module cap) as an upsell prompt. -->
        <script th:src="@{/js/demo.js}"></script>
        <!-- Wide grids (Fee Register = 13 columns) were clipped by the mobile body overflow rule rather
             than scrollable. Wraps each table in its own scroller once, at DOM-ready. -->
        <script th:src="@{/js/common/responsive-tables.js}"></script>
        <!-- Language menu affordance only — switching is a plain ?lang= link handled server-side. -->
        <script th:src="@{/js/common/lang-switcher.js}"></script>
        <!-- The self-rendering Configuration screen, shared by all four dashboards. -->
        <script th:src="@{/js/common/settings-form.js}"></script>
        <!-- Reads a COMPLETE Spring Data page set. Callers used to ask for one huge page (?size=2000),
             which Spring silently clamps to max-page-size — so a tenant past the cap lost products from
             every picker with no error at all. Must precede the module scripts that use it. -->
        <script th:src="@{/js/common/paged-fetch.js}"></script>
        <!-- PERF-8: one CACHED, lean read behind every product <select>. Loads here, beside paged-fetch,
             because it must precede every module script that fills a picker (business, order-booking,
             pharma). It registers a global ajaxComplete hook that drops the cache after any catalogue
             write, so a product added on one screen is sellable on the next without a reload. -->
        <script th:src="@{/js/common/product-picker.js}"></script>
        <!-- CSRF: send the XSRF-TOKEN cookie back as the X-XSRF-TOKEN header on every state-changing
             AJAX call, so jQuery $.post/$.ajax pass Spring Security's CSRF check. -->
        <script>
        (function () {
            function readCookie(name) {
                var m = document.cookie.match('(?:^|; )' + name + '=([^;]*)');
                return m ? decodeURIComponent(m[1]) : null;
            }
            if (window.jQuery) {
                // ajaxSend fires for EVERY jQuery request and is not overridden by a per-call
                // beforeSend, so it reliably stamps the header even on calls with custom options.
                jQuery(document).ajaxSend(function (event, xhr, settings) {
                    if (!/^(GET|HEAD|OPTIONS|TRACE)$/i.test(settings.type || 'GET')) {
                        var token = readCookie('XSRF-TOKEN');
                        if (token) { xhr.setRequestHeader('X-XSRF-TOKEN', token); }
                    }
                });
            }
        })();
        </script>
    </th:block>
</head>
<body>

    <!-- ═══ NAVBAR FRAGMENT ═══════════════════════════════════ -->
    <th:block th:fragment="header">
    <nav id="header" class="navbar navbar-inverse">
        <div class="container-fluid">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle collapsed"
                        data-toggle="collapse" data-target="#main-navbar-collapse"
                        aria-expanded="false">
                    <span class="sr-only" th:text="#{ui.toggleNavigation}">Toggle navigation</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand" th:href="@{/}">
                    <img th:src="@{/favicon.png}" height="28" width="24" alt="logo"
                         style="border-radius:6px;margin-right:8px;vertical-align:middle"/>
                    <span>MyPlus</span>
                </a>
            </div>

            <div class="collapse navbar-collapse" id="main-navbar-collapse">
                <ul class="nav navbar-nav">
                    <li>
                        <a th:href="@{/home}">
                            <span class="glyphicon glyphicon-home"></span> <span th:text="#{label.pages.home.title}">Home</span>
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/dashboard}">
                            <span class="glyphicon glyphicon-dashboard"></span> <span th:text="#{label.my.dashBoard}">Dashboard</span>
                        </a>
                    </li>
                </ul>
                <ul class="nav navbar-nav navbar-right">
                    <li style="display:flex;align-items:center;padding:9px 4px">
                        <th:block th:replace="~{fragments/lang-switcher :: lang-switcher}"></th:block>
                    </li>
                    <!-- Logged-in user info + logout -->
                    <li th:if="${#authorization.expression('isAuthenticated()')}"
                        style="display:flex;align-items:center;gap:10px;padding:5px 4px">
                        <span style="display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border-radius:100px;padding:3px 12px 3px 4px;color:#fff">
                            <span style="width:26px;height:26px;border-radius:50%;background:#1565C0;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0">
                                <span class="glyphicon glyphicon-user" style="font-size:12px"></span>
                            </span>
                            <span style="display:flex;flex-direction:column;line-height:1.15">
                                <span style="font-weight:600;font-size:12.5px" th:text="|${#authentication.principal.firstName} ${#authentication.principal.lastName}|">User</span>
                                <span style="opacity:.72;font-size:10.5px" th:text="${#authentication.principal.email}">email</span>
                            </span>
                        </span>
                        <a href="#" onclick="document.getElementById('logoutForm').submit(); return false;"
                           style="display:inline-flex;align-items:center;gap:6px;background:#e23b4e;color:#fff;border-radius:8px;padding:6px 14px;font-weight:600;font-size:12.5px;text-decoration:none;box-shadow:0 2px 8px rgba(226,59,78,.35)">
                            <span class="glyphicon glyphicon-log-out"></span> <span th:text="#{label.pages.logout}">Logout</span>
                        </a>
                        <form style="display:none" id="logoutForm"
                              method="post" th:action="@{/logout}"></form>
                    </li>
                    <li th:if="${#authorization.expression('!isAuthenticated()')}">
                        <a th:href="@{/login}">
                            <span class="glyphicon glyphicon-log-in"></span> <span th:text="#{label.form.login}">Sign in</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- Reset bar for the dev owner test account: it holds DEMO_RESET_PRIVILEGE but NOT DEMO_PRIVILEGE, so it
         is uncapped (no 50-entry message) yet can still wipe its own org back to a clean slate for a demo. -->
    <div sec:authorize="hasAuthority('DEMO_RESET_PRIVILEGE') and !hasAuthority('DEMO_PRIVILEGE')"
         style="background:linear-gradient(90deg,#0D3B8C,#1565C0);color:#fff;padding:8px 16px;text-align:center;font-size:13px">
        <span class="glyphicon glyphicon-info-sign" style="margin-right:5px"></span>
        <b>Owner demo account</b> — full access, no entry cap.
        <button type="button" onclick="resetDemo()" style="margin-left:10px;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:7px;padding:3px 12px;font-size:12px;cursor:pointer">
            <span class="glyphicon glyphicon-refresh"></span> Reset demo data
        </button>
    </div>
    <!-- Demo free-trial banner — shown only for demo accounts (DEMO_PRIVILEGE in the JWT). -->
    <div sec:authorize="hasAuthority('DEMO_PRIVILEGE')"
         style="background:linear-gradient(90deg,#0D3B8C,#1565C0);color:#fff;padding:8px 16px;text-align:center;font-size:13px">
        <span class="glyphicon glyphicon-info-sign" style="margin-right:5px"></span>
        <b>Demo mode</b> — free trial, up to 50 entries per module.
        <button type="button" onclick="resetDemo()" style="margin-left:10px;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:7px;padding:3px 12px;font-size:12px;cursor:pointer">
            <span class="glyphicon glyphicon-refresh"></span> Reset demo
        </button>
        <a href="/registration.html" style="color:#fff;text-decoration:underline;font-weight:600;margin-left:10px">Register for full access &rarr;</a>
    </div>
    </th:block>
</body>
</html>
