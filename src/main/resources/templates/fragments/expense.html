<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!--
	EX-1 — Expenses (expense-service). ONE fragment for every dashboard that offers the module: the business
	dashboard now; education, welfare and agriculture in EX-2. Behaviour lives in /js/common/expense.js.

	Hidden unless the tenant switched Expense management on ([data-capability] — capabilities.js). The server
	refuses every write when it is off, so the attribute is a courtesy, not the control.
-->
<div th:fragment="expenseSection(tagSource)" id="ExpenseDiv" data-capability="expenseManagement" class="formDiv" style="display:none"
	th:attr="data-tag-source=${tagSource}">
	<h4 style="font-weight:700;color:#1f4e8c" th:text="#{ui.expenses}">Expenses</h4>
	<p class="help-block" th:text="#{ui.expensesHelp}">
		Money paid out of the business: rent, electricity, fuel, repairs. Each expense is posted to your books.
	</p>

	<div style="max-width:900px">
		<h4 style="font-weight:700;color:#1f4e8c;font-size:15px" th:text="#{ui.newExpense}">New Expense</h4>
		<form class="form-horizontal" role="form" id="ExpenseForm" autocomplete="off" onsubmit="return false;">
			<div class="form-group">
				<label class="control-label col-sm-3" for="expDateTemp" th:text="#{ui.date}">Date</label>
				<div class="col-sm-4">
					<input type="text" class="form-control" id="expDateTemp" data-dp="date" data-dp-iso="#expDate" placeholder="dd-mm-yyyy">
					<input type="hidden" id="expDate">
				</div>
			</div>
			<div class="form-group">
				<label class="control-label col-sm-3" for="expCategory" th:text="#{ui.category}">Category</label>
				<div class="col-sm-5"><select class="form-control" id="expCategory" data-cy="expense-category"></select></div>
			</div>
			<div class="form-group">
				<label class="control-label col-sm-3" for="expAmount" th:text="#{ui.amount}">Amount</label>
				<div class="col-sm-4">
					<input type="number" step="0.01" min="0.01" class="form-control" id="expAmount" data-cy="expense-amount" inputmode="decimal">
				</div>
			</div>
			<!-- EX-2b — what the expense was for (school / vehicle / land). Shown only where the dashboard declares a
			     tag source; the server confirms the choice with the module that owns it. -->
			<div class="form-group" id="expTagGroup" style="display:none">
				<label class="control-label col-sm-3" for="expTag" th:text="#{ui.expFor}">For</label>
				<div class="col-sm-5"><select class="form-control" id="expTag" data-cy="expense-tag"></select></div>
			</div>
			<div class="form-group">
				<label class="control-label col-sm-3" for="expPaidFrom" th:text="#{ui.paidFrom}">Paid from</label>
				<div class="col-sm-4">
					<select class="form-control" id="expPaidFrom" data-cy="expense-paid-from">
						<option value="CASH" th:text="#{ui.cash}">Cash</option>
						<option value="BANK" th:text="#{ui.bank}">Bank</option>
						<!-- FP-3: "Bill (pay later)" is added by expense.js only when this business has suppliers -->
					</select>
				</div>
			</div>
			<!-- FP-3 — a BILL: owed to a supplier, paid later. The supplier list is business-service's own (the server
			     confirms the choice again on save). Shown only while "Bill (pay later)" is chosen. -->
			<div id="expBillGroup" style="display:none">
				<div class="form-group">
					<label class="control-label col-sm-3" for="expSupplier" th:text="#{ui.supplier}">Supplier</label>
					<div class="col-sm-5"><select class="form-control" id="expSupplier" data-cy="expense-supplier"></select></div>
				</div>
				<div class="form-group">
					<label class="control-label col-sm-3" for="expDueTemp" th:text="#{ui.dueDate}">Due date</label>
					<div class="col-sm-4">
						<input type="text" class="form-control" id="expDueTemp" data-dp="date" data-dp-iso="#expDue" placeholder="dd-mm-yyyy">
						<input type="hidden" id="expDue">
					</div>
				</div>
			</div>
			<div class="form-group">
				<label class="control-label col-sm-3" for="expPayee" th:text="#{ui.payee}">Payee</label>
				<div class="col-sm-5">
					<input type="text" class="form-control" id="expPayee" maxlength="160" th:placeholder="#{ui.js.expPayeePh}">
				</div>
			</div>
			<div class="form-group">
				<label class="control-label col-sm-3" for="expNote" th:text="#{ui.note}">Note</label>
				<div class="col-sm-7"><input type="text" class="form-control" id="expNote" maxlength="255" data-cy="expense-note"></div>
			</div>
			<div class="form-group">
				<div class="col-sm-offset-3 col-sm-9">
					<button type="button" class="btn btn-primary" id="expSave" data-cy="save-expense" onclick="expenseSave(this)">
						<span class="glyphicon glyphicon-ok"></span> <span th:text="#{ui.saveAndPost}">Save and post</span>
					</button>
					<span id="expMsg" class="help-inline" role="status" aria-live="polite" style="margin-left:12px"></span>
				</div>
			</div>
		</form>
	</div>

	<div class="form-inline" style="margin:22px 0 8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center">
		<label for="expFromTemp" th:text="#{ui.from}">From</label>
		<input type="text" class="form-control" id="expFromTemp" data-dp="date" data-dp-iso="#expFrom" style="width:130px">
		<input type="hidden" id="expFrom">
		<label for="expToTemp" th:text="#{ui.to}">To</label>
		<input type="text" class="form-control" id="expToTemp" data-dp="date" data-dp-iso="#expTo" style="width:130px">
		<input type="hidden" id="expTo">
		<button type="button" class="btn btn-default" onclick="expenseLoad()">
			<span class="glyphicon glyphicon-search"></span> <span th:text="#{ui.search}">Search</span>
		</button>
	</div>
	<!-- FP-3 — pay (part of) a bill. Opened by a row's Pay button; ONE Idempotency-Key per opening, so pressing Pay
	     again after a lost answer is the same payment, never a second one. -->
	<div id="expPayPanel" class="well well-sm" style="display:none;max-width:900px" data-cy="expense-pay-panel">
		<strong id="expPayTitle"></strong>
		<div class="form-inline" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px">
			<label for="expPayAmount" th:text="#{ui.amount}">Amount</label>
			<input type="number" step="0.01" min="0.01" class="form-control" id="expPayAmount" data-cy="expense-pay-amount" inputmode="decimal" style="width:140px">
			<label for="expPayMethod" th:text="#{ui.paidFrom}">Paid from</label>
			<select class="form-control" id="expPayMethod" data-cy="expense-pay-method" data-no-search="true">
				<option value="CASH" th:text="#{ui.cash}">Cash</option>
				<option value="BANK" th:text="#{ui.bank}">Bank</option>
			</select>
			<button type="button" class="btn btn-primary" id="expPayGo" data-cy="expense-pay-go" onclick="expensePay(this)">
				<span class="glyphicon glyphicon-ok"></span> <span th:text="#{ui.pay}">Pay</span>
			</button>
			<button type="button" class="btn btn-default" onclick="expensePayClose()" th:text="#{ui.cancel}">Cancel</button>
			<span id="expPayMsg" class="help-inline" role="status" aria-live="polite"></span>
		</div>
	</div>
	<div class="table-responsive">
		<table class="table table-condensed" id="tableExpense" data-cy="expense-list" style="width:100%">
			<thead>
				<tr>
					<th th:text="#{ui.expenseNo}">Expense no.</th>
					<th th:text="#{ui.date}">Date</th>
					<th th:text="#{ui.category}">Category</th>
					<th th:text="#{ui.paidFrom}">Paid from</th>
					<th th:text="#{ui.payee}">Payee</th>
					<th style="text-align:right" th:text="#{ui.amount}">Amount</th>
					<th th:text="#{ui.status}">Status</th>
					<th sec:authorize="hasAnyAuthority('ROLE_OWNER','ADMIN_PRIVILEGE')" th:text="#{ui.actions}">Actions</th>
				</tr>
			</thead>
			<tbody></tbody>
		</table>
	</div>
</div>
</body>
</html>
