<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${htmlLang ?: 'en'}" th:dir="${htmlDir ?: 'ltr'}" lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title th:text="#{ui.mktPageTitle}">MaxTheService Marketplace</title>
    <meta name="description" th:content="#{ui.mktPageLede}" content="Compare sellers for the same product and choose who you buy from.">
    <link th:if="${langWebfont}" rel="stylesheet"
          th:href="'https://fonts.googleapis.com/css2?family=' + ${langWebfont} + '&display=swap'"/>
    <!--
      MKT-1d public marketplace (docs/slices/mkt-1d-public-catalogue.md). Self-contained on purpose: an anonymous
      shopper's first page loads no jQuery and no dashboard CSS. Logical properties (margin-inline, inset-inline) so
      Urdu and Arabic mirror without a second stylesheet.
    -->
    <style>
        :root{
            --bg:#f5f6f8; --surface:#ffffff; --ink:#17202b; --muted:#5a6473; --line:#dfe3e9; --soft:#eef1f5;
            --brand:#1f4e8c; --brand-ink:#ffffff; --brand-soft:#e7eef8; --good:#1f7a4d; --warn:#9a6400; --bad:#b3261e;
            --radius:10px; --focus:0 0 0 3px rgba(31,78,140,.35);
        }
        @media (prefers-color-scheme: dark){:root{
            --bg:#0f141b; --surface:#161c25; --ink:#e7ebf1; --muted:#9aa5b5; --line:#2a3340; --soft:#1d2530;
            --brand:#8ea6ff; --brand-ink:#0f141b; --brand-soft:#232d4a; --good:#5fd39a; --warn:#f0bf5a; --bad:#ff8a80;
            --focus:0 0 0 3px rgba(142,166,255,.45);
        }}
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
        [dir="rtl"] body{font-family:"Noto Naskh Arabic","Noto Nastaliq Urdu",system-ui,sans-serif}
        a{color:var(--brand)}
        .skip{position:absolute;inset-inline-start:-999px;top:0;background:var(--surface);padding:8px 12px;z-index:10}
        .skip:focus{inset-inline-start:8px}
        header.top{background:var(--surface);border-bottom:1px solid var(--line)}
        .bar{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
        .brand{font-weight:700;font-size:18px;color:var(--ink);text-decoration:none;margin-inline-end:auto}
        .langs{display:flex;gap:4px;flex-wrap:wrap}
        .langs a{font-size:13px;text-decoration:none;color:var(--muted);padding:6px 8px;border-radius:6px;min-height:32px;display:inline-flex;align-items:center}
        .langs a[aria-current="true"]{background:var(--soft);color:var(--ink);font-weight:600}
        main{max-width:1120px;margin:0 auto;padding:16px 16px 120px}
        h1{font-size:clamp(22px,3.2vw,30px);line-height:1.2;margin:8px 0 4px}
        /* focus is moved to the product heading for screen readers; a heading is not a control, so no ring */
        h1[tabindex="-1"]:focus,main:focus{outline:none;box-shadow:none}
        .lede{color:var(--muted);margin:0 0 14px}
        form.search{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,220px) auto;gap:8px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
        @media (max-width:640px){form.search{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} form.search .go{grid-column:1/-1}}
        label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
        input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
        input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:none;box-shadow:var(--focus)}
        button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 16px;min-height:44px;cursor:pointer}
        .go,.buy{background:var(--brand);color:var(--brand-ink)}
        button:disabled{opacity:.5;cursor:not-allowed}
        .status{color:var(--muted);font-size:14px;margin:14px 2px 8px;min-height:1.5em}
        .status.err{color:var(--bad)}
        ul.cards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
        .mkt-product-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:flex}
        .mkt-product-card a{display:grid;gap:4px;padding:14px;color:inherit;text-decoration:none;width:100%;border-radius:var(--radius)}
        .mkt-product-card a:hover{background:var(--soft)}
        .card-brand{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
        .card-name{font-weight:600;line-height:1.3}
        .mkt-from-price{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
        .mkt-offer-count{font-size:14px;color:var(--brand)}
        .card-fast{font-size:13px;color:var(--muted)}
        .more{display:block;margin:14px auto 0;background:var(--soft);color:var(--ink)}
        .back{display:inline-flex;align-items:center;gap:6px;margin:4px 0;min-height:44px;text-decoration:none}
        .attrs{color:var(--muted);margin:0 0 12px}
        .toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:8px 0 12px}
        .toolbar label.f{min-width:200px}
        fieldset{border:0;margin:0;padding:0;min-width:0}
        legend{font-weight:600;margin-bottom:8px;padding:0}
        ul.offers{list-style:none;margin:0;padding:0;display:grid;gap:10px}
        .mkt-offer-row{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
        .mkt-offer-row label{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:start;padding:14px;cursor:pointer;border-radius:var(--radius)}
        .mkt-offer-row:has(input:checked){border-color:var(--brand);box-shadow:0 0 0 1px var(--brand);background:var(--brand-soft)}
        .mkt-choose-offer{width:22px;height:22px;min-height:0;margin:2px 0 0;accent-color:var(--brand)}
        .o-seller{font-weight:600}
        .o-price{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;text-align:end;white-space:nowrap}
        .o-facts{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--muted)}
        .o-facts b{color:var(--ink);font-weight:600}
        .mkt-stock-checked{font-size:12px}
        .buybar{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
        .buybar .in{max-width:1120px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
        .buy{flex:0 1 auto;min-width:220px}
        #mktBuyNote{font-size:14px;color:var(--muted);flex:1 1 240px}
        .empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:24px;text-align:center;color:var(--muted)}
        .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
        [hidden]{display:none!important}
        @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
    </style>
</head>
<body th:attr="data-ctx=@{/}">
<a class="skip" href="#main" th:text="#{ui.mktSkip}">Skip to results</a>
<header class="top">
    <div class="bar">
        <a class="brand" th:href="@{/marketplace}" th:text="#{ui.mktPageTitle}">MaxTheService Marketplace</a>
        <nav class="langs" th:if="${supportedLanguages}" th:attr="aria-label=#{ui.mktLanguage}" aria-label="Language">
            <a th:each="l : ${supportedLanguages}" th:href="'?lang=' + ${l.tag}" th:lang="${l.tag}" th:text="${l.endonym}"
               th:attr="aria-current=${currentLang != null and l.tag == currentLang.tag}, data-lang=${l.tag}"
               class="mkt-lang">English</a>
        </nav>
    </div>
</header>

<main id="main" tabindex="-1">
    <!-- ── search + results ─────────────────────────────────────────────────────────────────────────── -->
    <section id="mktSearchView" th:attr="aria-label=#{ui.mktSearchLabel}" aria-label="Search">
        <h1 th:text="#{ui.mktPageHeading}">Compare sellers. Choose who you buy from.</h1>
        <p class="lede" th:text="#{ui.mktPageLede}">One product, every approved seller, side by side.</p>
        <form class="search" id="mktSearchForm" role="search" method="get" th:action="@{/marketplace}" action="/marketplace">
            <label class="f"><span th:text="#{ui.mktSearchLabel}">Search</span>
                <input type="search" id="mktSearch" name="q" maxlength="80" autocomplete="off" enterkeyhint="search"
                       th:placeholder="#{ui.mktSearchPh}" placeholder="e.g. Galaxy A32 128GB">
            </label>
            <label class="f"><span th:text="#{ui.mktCityLabel}">Deliver to (city)</span>
                <input type="text" id="mktCity" name="city" maxlength="60" autocomplete="address-level2"
                       th:placeholder="#{ui.mktCityPh}" placeholder="e.g. Karachi">
            </label>
            <button type="submit" class="go" th:text="#{ui.mktSearchBtn}">Search</button>
        </form>
        <p id="mktResultCount" class="status" role="status" aria-live="polite"></p>
        <ul id="mktResults" class="cards"></ul>
        <button type="button" id="mktMore" class="more" hidden th:text="#{ui.mktMore}">Show more</button>
    </section>

    <!-- ── one product, its offers ──────────────────────────────────────────────────────────────────── -->
    <section id="mktProductView" hidden>
        <a href="#" id="mktBack" class="back"><span aria-hidden="true">←</span> <span th:text="#{ui.mktBack}">Back to results</span></a>
        <h1 id="mktProductName" tabindex="-1"></h1>
        <p id="mktProductAttrs" class="attrs"></p>
        <div class="toolbar">
            <label class="f"><span th:text="#{ui.mktSortLabel}">Sort sellers by</span>
                <select id="mktOfferSort">
                    <option value="RECOMMENDED" th:text="#{ui.mktSortRecommended}">Recommended</option>
                    <option value="LOWEST_PRICE" th:text="#{ui.mktSortLowestPrice}">Lowest price</option>
                    <option value="FASTEST" th:text="#{ui.mktSortFastest}">Fastest delivery</option>
                    <option value="WARRANTY" th:text="#{ui.mktSortWarranty}">Longest warranty</option>
                    <option value="RETURN_POLICY" th:text="#{ui.mktSortReturns}">Longest returns</option>
                </select>
            </label>
            <label class="f"><span th:text="#{ui.mktCityLabel}">Deliver to (city)</span>
                <input type="text" id="mktOfferCity" maxlength="60" autocomplete="address-level2">
            </label>
        </div>
        <p id="mktOfferStatus" class="status" role="status" aria-live="polite"></p>
        <fieldset id="mktOfferSet">
            <legend th:text="#{ui.mktChooseSeller}">Choose a seller</legend>
            <ul id="mktOffers" class="offers"></ul>
        </fieldset>
    </section>
</main>

<div class="buybar" id="mktBuyBar" hidden>
    <div class="in">
        <button type="button" id="mktBuyBtn" class="buy" disabled th:text="#{ui.mktChooseFirst}">Choose a seller first</button>
        <span id="mktBuyNote" role="status" aria-live="polite"></span>
    </div>
</div>

<script th:inline="javascript">/*<![CDATA[*/
    window.__MSG = /*[[${jsMessages}]]*/ {};
/*]]>*/</script>
<script th:src="@{/js/common/i18n.js}" src="/js/common/i18n.js"></script>
<script th:src="@{/js/common/api-response.js}" src="/js/common/api-response.js"></script>
<script th:src="@{/js/marketplace/marketplace-public.js}" src="/js/marketplace/marketplace-public.js"></script>
</body>
</html>
