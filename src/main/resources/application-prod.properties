# Monolith PROD hardening (active with SPRING_PROFILES_ACTIVE=prod). Overrides application.properties;
# local dev (default profile) is unaffected. See docs/prod-hardening.md (P3).

# F9: Hibernate must not mutate a live schema. 'update' first prod boot, 'validate' after Flyway (P4).
hibernate.hbm2ddl.auto=${DDL_AUTO:validate}
hibernate.show_sql=false

# Caching ON in prod (dev disables this for hot-reload).
spring.thymeleaf.cache=true

# PERF-2 / audit F1: `spring.web.resources.cache.period=3600` used to live here. It was INERT for the whole
# life of prod-hardening P3 — @EnableWebMvc on com.spring.MvcConfig disables the WebMvcAutoConfiguration
# that reads it, so prod static assets shipped with no Cache-Control at all. Removed rather than left
# looking effective. The live equivalents are app.static.* in application.properties, applied imperatively
# by MvcConfig; prod inherits them unchanged because content-hash URLs make one year safe in every profile.

# F12 (DevTools): off in prod.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# F13: bound uploads.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# F11: quiet SQL logging.
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN

# F10: minimal actuator.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Observability: sample 10% of traces in prod (bounds overhead/volume); raise via TRACE_SAMPLE.
otel.traces.sampler.arg=${TRACE_SAMPLE:0.1}
