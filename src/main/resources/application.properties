spring.mvc.favicon.enabled=false

# spring.thymeleaf.cache=true
#    5am every day
purge.cron.expression=0 0 5 * * ?

server.port=8080

# reCAPTCHA v2 site key — renders the login/registration widget only. Verification is done by
# auth-service (slice 33, Phase 9), so the monolith needs just the site key. Default is Google's
# universal v2 test key; override in production via the GOOGLE_RECAPTCHA_KEY_SITE env var.
google.recaptcha.key.site=${GOOGLE_RECAPTCHA_KEY_SITE:6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI}

# Feature toggles (env-overridable). Captcha (login/registration/forgot) is off unless turned on;
# 2FA (Google Authenticator) flow is on by default.
app.captcha.enabled=${CAPTCHA_ENABLED:false}
app.twofa.enabled=${TWOFA_ENABLED:false}

# "Users online" badge on the landing/login headers (see LiveUserCountService).
# The multiplier inflates the displayed figure above the real session count — set it to 1 to publish
# the true number. A value above 1 is a public claim that does not match reality, so keep it
# temporary and be aware it can count as misleading advertising where visitors are prospects.
app.live-users.enabled=${LIVE_USERS_ENABLED:true}
app.live-users.multiplier=${LIVE_USERS_MULTIPLIER:5}

################### JavaMail Configuration ##########################
support.email=maxtheservice@gmail.com
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.protocol=smtps
spring.mail.username=maxtheservice
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtps.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.transport.protocol=smtps
spring.mail.properties.mail.smtps.auth=true
spring.mail.properties.mail.smtps.starttls.enable=true
spring.mail.properties.mail.smtps.timeout=8000

# uncomment this property to see the SQL statements generated
#logging.level.org.hibernate.SQL=DEBUG

# server.contextPath=/
server.servlet.context-path =/

spring.main.allow-bean-definition-overriding=true

# spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.jackson.serialization.write-dates-as-timestamps=false

# Thymeleaf — disable cache so template changes reflect instantly
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/

# DevTools — auto restart on class changes
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Static resources — disable cache for JS/CSS
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# Service identity
spring.application.name=myplus

# The monolith does NOT use Spring Cloud Config — it owns no database and reads its own config here.
# (Importing the microservices' shared config-server profile would pull in spring.datasource/JPA/Flyway
# settings meant for the services and make this UI app try to connect to a DB it doesn't have.)
# spring-cloud-starter-config is on the classpath but the monolith does NOT use Config Server, so
# disable the client (this also turns off its import-check, which otherwise fails startup demanding a
# configserver: entry in spring.config.import).
spring.cloud.config.enabled=false
# Load git-ignored local secrets (DB_PASSWORD, MAIL_PASSWORD, RECAPTCHA_SECRET, INTERNAL_SECRET) for dev;
# in prod these come from the environment / Secrets Manager. See .env.example.
#
# BOTH files are imported, and `.env` is listed LAST so it wins where the two disagree — mirroring
# `start-all.ps1`, which prefers `.env` and falls back to `.env.local`. Keeping the same precedence in
# both launchers is the point: one value, `INTERNAL_SECRET`, must mean the same thing to the monolith and
# to every service, or the monolith stamps a secret the services do not accept and every proxied screen
# silently loses its identity (security finding F18).
#
# ⚠️ `microservices/.env` is a DIFFERENT file — start-all reads it because it uses $PSScriptRoot, not the
# repo root. Both are git-ignored. If you keep the canonical value there, mirror it into a repo-root
# `.env` (or `.env.local`) so the monolith sees the same one.
#
# `optional:` throughout, so a missing file is not a startup failure.
spring.config.import=optional:file:./.env.local[.properties],optional:file:./.env[.properties]

# Service discovery — Eureka client. Host is env-overridable (EUREKA_URI) so Docker/prod can point it
# at the eureka-server container; default localhost:8761 is for running the monolith outside Docker.
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# --- Observability (OpenTelemetry Spring Boot starter) — export traces + logs over OTLP ---
# The monolith is the browser-facing entry, so it roots the trace and propagates context to the
# gateway. OFF by default so running WITHOUT the observability stack makes no export attempts (no
# "UnknownHostException: otel-collector" spam); the observability overlay sets OTEL_SDK_DISABLED=false.
otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
otel.service.name=${spring.application.name}
otel.exporter.otlp.endpoint=${OTLP_ENDPOINT:http://otel-collector:4318}
otel.exporter.otlp.protocol=http/protobuf
otel.traces.exporter=otlp
otel.traces.sampler=parentbased_traceidratio
otel.traces.sampler.arg=${TRACE_SAMPLE:1.0}
otel.logs.exporter=otlp
otel.metrics.exporter=otlp
otel.propagators=tracecontext,baggage
otel.instrumentation.logback-appender.experimental.capture-mdc-attributes=user_id,org_id

# --- Auth integration (Phase 2) ---
# auth.mode: 'local' authenticates against the local DB (legacy); 'server' delegates login to
# the auth-service JWT IdP. Keep 'local' until the user-store migration (Phase 1 SQL) has run.
# auth.mode=local

auth.mode=server
# Auth server reached via the API gateway; /api/auth/** is open (no JWT filter).
auth.server.url=http://localhost:8765

# API gateway base for downstream service calls (Phase 3). In server mode GatewayClient calls
# gateway.url + /api/<service> + path with a Bearer token; in local mode it falls back to the
# per-service *.service.url below with X-User-* headers.
gateway.url=http://localhost:8765

# Security finding F18 (2026-08-09). The SAME env var the gateway and every service read, so one value
# configures the whole platform and the monolith cannot drift out of step with it.
#
# GatewayClient stamps this as X-Internal-Secret on DIRECT (non-gateway) calls. Until it did, setting
# INTERNAL_SECRET anywhere would have made HeaderAuthFilter ignore the monolith's identity headers —
# silently de-authenticating every screen this app proxies. Empty (the default) changes nothing.
service.internal-secret=${INTERNAL_SECRET:}

business.service.url=http://localhost:8083
education.service.url=http://localhost:8084
welfare.service.url=http://localhost:8085
agriculture.service.url=http://localhost:8086