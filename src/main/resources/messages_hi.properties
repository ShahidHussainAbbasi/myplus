# Hindi (hi) UI strings. UTF-8 — the message source is configured with setDefaultEncoding("UTF-8"),
# so Devanagari is written natively rather than as \uXXXX escapes.
# Hindi is LEFT-TO-RIGHT but still needs a webfont: Inter has no Devanagari coverage, so
# SupportedLanguage.HINDI declares Noto Sans Devanagari (font need is separate from direction).
# Key order mirrors messages.properties (the English base) so the two diff cleanly.

