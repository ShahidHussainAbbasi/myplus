# i18n: JS-side copies. window.__MSG only carries the ui.js.* prefix (JsMessageSource),
# and i18n.js t() returns the KEY when it is missing - so a t('ui.x') call renders "ui.x"
# on screen and its `|| fallback` never fires, because the key string is truthy.
ui.js.subTotal=Sous-total
