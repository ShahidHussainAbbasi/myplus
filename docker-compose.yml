version: '3.9'

# Legacy standalone-monolith compose. Its own project name keeps it apart from the live stack in
# microservices/docker-compose.yml (`name: myplus`): sharing the default name made `docker compose up`
# there report this file's containers (myplus, mysqlservice) as orphans.
name: myplus-legacy

services:
  mysqlservice:
    image: mysql:latest
    container_name: mysqlservice
    restart: always
    environment:
      MYSQL_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_DATABASE: myplusdb
    ports:
      - "3306:3306"
    # volumes:
    #   - ./mysql-data:/var/lib/mysql
    #   - ./mysql-scripts:/docker-entrypoint-initdb.d
  myplus:
    build:
      context: .
      dockerfile: Dockerfile
    image: myplus
    container_name: myplus
    depends_on:
      - mysqlservice
    ports:
      - "8080:8080"
