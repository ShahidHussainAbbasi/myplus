server:
  port: 8092

spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/myplusdb_catalog?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=%2B05:00&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: false
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# D-6 — where the shared /outbox-health endpoint is mapped in THIS service.
#
# It belongs here rather than in config-server, and the difference is not cosmetic: this is a fact about how
# the service is ROUTED, not about the environment it runs in — the same category as server.port above, which
# is also local. catalog-service is routed WITHOUT StripPrefix, so its controllers are mapped at the full
# /api/... path and the shared endpoint must match. business and education are stripped and use the default.
#
# Putting it in config-server cost a gate run: config-server serves its configs from its own jar, so the
# property did not exist until THAT was rebuilt, and the endpoint 404'd in a way that reads exactly like an
# unregistered bean. A property the service cannot start correctly without should ship with the service.
outbox:
  health:
    base-path: /api/catalog
