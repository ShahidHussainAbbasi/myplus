server:
  port: 8097

spring:
  application:
    name: expense-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/myplusdb_expense?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=%2B05:00&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: false
    open-in-view: false
  # EX-5 — a receipt is at most 6 MB (the screen shrinks photos far below that before sending)
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  flyway:
    # A new service: Flyway owns the schema from V1 on an empty database (STANDARDS D1). No baseline.
    baseline-on-migrate: false

# EX-1 — retry delay for vouchers whose ledger posting did not land on the first, after-commit attempt.
expense:
  outbox:
    relay-delay-ms: 15000
  # EX-5 — where receipts are kept (a Docker volume in the stack; S3 later, behind the ReceiptStore port)
  receipts:
    dir: ${EXPENSE_RECEIPTS_DIR:/data/receipts}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
