        condition: service_healthy
      config-server:
        condition: service_healthy

  business-service:
    build: ./business-service
    container_name: myplus-business
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    expose:
      - "8083"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -Xss512k"
      <<: *db-env
      EUREKA_URI: http://eureka-server:8761/eureka
      CONFIG_URI: http://config-server:8888
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    networks: [myplus-net]
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy

  # Shared finance ledger — customer/vendor payments + receipts. POS customer payments record here
  # (best-effort from business-service; the receipt number + ledger entry come from this service).
  finance-service:
    build: ./finance-service
    container_name: myplus-finance
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    expose:
      - "8094"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -Xss512k"
      <<: *db-env
      EUREKA_URI: http://eureka-server:8761/eureka
      CONFIG_URI: http://config-server:8888
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    networks: [myplus-net]
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy

  # Standalone append-only audit trail — producers (business now; finance/inventory later) emit money/stock/config
  # events here via their transactional outbox. Own DB; immutable store + org-scoped reads.
  audit-service:
    build: ./audit-service
    container_name: myplus-audit
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    expose:
      - "8095"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -Xss512k"
      <<: *db-env
      EUREKA_URI: http://eureka-server:8761/eureka
      CONFIG_URI: http://config-server:8888
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    networks: [myplus-net]
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy

  education-service:
    build: ./education-service
    container_name: myplus-education
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    expose:
      - "8084"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -Xss512k"
      <<: *db-env
      EUREKA_URI: http://eureka-server:8761/eureka
      CONFIG_URI: http://config-server:8888
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-maxtheservice}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
    networks: [myplus-net]
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy

  welfare-service:
    build: ./welfare-service
    container_name: myplus-welfare
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    expose:
      - "8085"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -Xss512k"
      <<: *db-env
      EUREKA_URI: http://eureka-server:8761/eureka
      CONFIG_URI: http://config-server:8888
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    networks: [myplus-net]
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy

  agriculture-service:
    build: ./agriculture-service
    container_name: myplus-agriculture
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    expose:
      - "8086"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -Xss512k"
      <<: *db-env
      EUREKA_URI: http://eureka-server:8761/eureka
      CONFIG_URI: http://config-server:8888
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    networks: [myplus-net]
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy

  pharma-service:
    build: ./pharma-service
    container_name: myplus-pharma
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    expose:
      - "8087"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -Xss512k"
      <<: *db-env
      EUREKA_URI: http://eureka-server:8761/eureka
      CONFIG_URI: http://config-server:8888
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    networks: [myplus-net]
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy

  marketplace-service:
    build: ./marketplace-service
    container_name: myplus-marketplace
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    expose:
