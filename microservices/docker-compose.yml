  # Selling works without it (the record just saves with a null party_id and re-links on the next
  # write) — but DEPLOY-POS-RETAIL.md §3.3/§4.6 name it in the bring-up, so it must exist here.
  party-service:
    build: ./party-service
    container_name: myplus-party
    restart: unless-stopped
