    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    expose:
      - "8092"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8092/actuator/health/readiness"]
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -Xss512k"
      <<: *db-env
