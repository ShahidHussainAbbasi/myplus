      config-server:
        condition: service_healthy
      # Startup tier 3. Without this every vertical launched the moment config-server went healthy,
      # so 18 JVMs JIT-compiled at once and starved each other of CPU — that is why api-gateway took
      # 193s to answer its first probe and compose aborted. Waiting on the gateway splits the herd
      # into waves (core -> gateway -> verticals) and costs nothing: every request routes through the
      # gateway anyway, so a vertical that starts before it is up serves no one.
      api-gateway:
        condition: service_healthy

  # The monolith (Thymeleaf UI). Built from the repo root; serves on 8080. Talks to the gateway
  # in-network and to MySQL `myplusdb`. (Build the jar first: from repo root `mvn -DskipTests package`.)
  monolith:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: myplus-monolith
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1024m
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -Xss512k"
      SPRING_PROFILES_ACTIVE: prod
      # P5: the monolith owns no database — no JDBC_URL/DB_* needed. Data lives in the microservices.
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      RECAPTCHA_SECRET: ${RECAPTCHA_SECRET:-}
      AUTH_SERVER_URL: http://api-gateway:8765   # auth.server.url
      GATEWAY_URL: http://api-gateway:8765        # gateway.url
      EUREKA_URI: http://eureka-server:8761/eureka   # else it defaults to localhost:8761 (unreachable in-container)
    networks: [myplus-net]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health/readiness"]
    depends_on:
      # service_healthy, not service_started: the monolith proxies every screen through the gateway, so
      # starting before it is ready gives the first requests a connection error. That is exactly the
      # cold-start window that made the first Cypress test of a run fail on 2026-08-05.
      api-gateway:
        condition: service_healthy

networks:
  myplus-net:
    driver: bridge

volumes:
  mysql-data:
