      config-server:
        condition: service_healthy

  # Standalone append-only audit trail — producers (business now; finance/inventory later) emit money/stock/config
  # events here via their transactional outbox. Own DB; immutable store + org-scoped reads.
  audit-service:
    build: ./audit-service
    container_name: myplus-audit
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    expose:
