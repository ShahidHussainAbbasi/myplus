# =============================================================================
# Phase 4 — network isolation + internal-secret enforcement.
#
# Only EDGE components publish host ports: mysql (3306, for the external monolith
# + migration), eureka (8761), config-server (8888) and the api-gateway (8765).
# The resource services and auth-service use `expose` only, so they are reachable
# ONLY from inside the private `myplus-net` network (i.e. via the gateway) and
# cannot be hit directly from the host to forge X-User-* headers.
#
# INTERNAL_SECRET is the shared gateway<->service trust token. The gateway stamps
# X-Internal-Secret; each service's HeaderAuthFilter rejects identity headers that
# don't carry it. Override per environment; the default below is for local stacks.
# NOTE: this stack assumes the monolith runs with auth.mode=server (calls flow
# through the gateway). Legacy direct calls would be rejected once enforced.
# =============================================================================
# PROFILES — which services come up
#
#   docker compose up -d --build                     # POS/retail subset (the VPS deployment)
#   docker compose --profile pharmacy up -d --build  # POS + pharma-service (a pharmacy IS POS + clinical)
#   docker compose --profile full up -d --build      # every module
#
# The eight vertical services (education, welfare, agriculture, pharma, marketplace, campaign,
# analytics, appointment) carry `profiles: ["full"]`, so a bare `up` starts the POS subset:
# mysql, redis, eureka, config, gateway, auth, notification, catalog, inventory, business, finance,
# audit, party, monolith. MEASURED 2026-08-05: 10.75 GB of mem_limit vs 16.75 GB for the full stack.
# Those are CEILINGS. Measured idle RSS is far lower — the whole 21-container full stack sat at 7.5 GB —
# but ceilings are what the OOM killer works against once anything is under load.
#
# pharma-service additionally carries `pharmacy`, because a pharmacy deployment is exactly the POS
# subset plus that one service (dispensing IS a POS sale; the clinical layer sits beside it). Its three
# collaborators — catalog, inventory, party — are already in the default subset, so `--profile pharmacy`
# needs nothing else. 11.5 GB of mem_limit. A service starts when ANY of its profiles is active, so pharma
# still comes up under `full` too.
#
# This REPLACES the hand-typed service list the runbook used to carry. That list drifted — party-service
# was named in the runbook but missing from this file, and `up` died with "no such service" mid-deploy.
# A profile cannot drift from the service definitions because it IS one.
#
# CHANGED BEHAVIOUR: a bare `docker compose up -d` no longer starts the vertical services. If a host is
# meant to run everything, it must now pass `--profile full`. Existing containers of disabled profiles
# are left running, not stopped — but `--remove-orphans` WOULD remove them, so do not pair it with a
# bare `up` on a full-stack host.
# =============================================================================
# Shared DB connection env for every DB-backed service. config-server serves
# spring.datasource.* built from these ${DB_HOST}/${DB_USER}/${DB_PASSWORD}
# placeholders, and Spring Cloud Config OVERRIDES container env by default — so
# THESE are the vars that actually take effect, not SPRING_DATASOURCE_*. Inside
# the network the DB host is the `mysql` service. `shahid` must exist in MySQL
# with CREATE DATABASE privilege (createDatabaseIfNotExist needs it for the
# catalog/finance/appointment DBs, which init-db.sql does not pre-create).
x-db-env: &db-env
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USER: shahid
  DB_PASSWORD: ${DB_PASSWORD}

# Shared log-rotation policy for EVERY container. Docker's default json-file driver never
# rotates, so container logs grow unbounded and fill the VPS disk (which then looks like the
# box running out of memory: MySQL can't write, JVMs OOM-adjacent failures, etc.). Capping at
# 3 × 10 MB = 30 MB per container bounds total log disk to ~0.6 GB across the 20 services and
# keeps `docker compose logs` working. Referenced by each service as `logging: *default-logging`.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Shared healthcheck timing for the Spring Boot app services. Each service supplies its own `test`
# (the port differs); everything else is identical, so it lives here.
#
# start_period is generous on purpose: a service waits on config-server + Eureka before it finishes
# booting, and locally these take 21-31s on a warm machine — a cold VPS is slower. Failures during
# start_period do NOT count toward `retries`, so this only delays the first verdict, it never hides a
# genuinely dead container.
#
# RAISED 90s -> 240s on 2026-08-05 for the `full` profile. 90s was calibrated on the 14-service POS
# subset. Starting 21 JVMs at once is a thundering herd — they contend for CPU, and on a 12-core box the
# gateway took ~193s to answer its first probe. The old window (90s start_period + 5 x 15s retries) gave
# up first, so compose aborted with "dependency failed to start: container myplus-gateway is unhealthy"
# and never started the monolith — while every service was in fact coming up fine and reported healthy
# minutes later. The failure mode is a LIE: nothing was wrong, the deadline was just too short.
#
# Since start_period failures are free, the only cost of 240s is a later verdict on a container that is
# genuinely dead. That is the right trade for a 22-service stack.
#
# The probe is /actuator/health/READINESS, not /actuator/health — see the note in config-server's
# application.yml. The full endpoint includes `db`, which flaps DOWN under load and would take healthy
# containers with it.
x-healthcheck: &app-healthcheck
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 240s

services:
  mysql:
    image: mysql:8.0
    container_name: myplus-mysql
    restart: unless-stopped
    logging: *default-logging
    # Headroom above the combined service pools so admin/replication/spikes fit.
    # 15 DB-backed services (auth, inventory, catalog, business, finance, audit, party, education, welfare,
    # agriculture, pharma, marketplace, campaign, analytics, appointment) × DB_POOL_MAX 8 = 120 at full
    # saturation, leaving ~80 spare. Was written for 11 services; recount when adding a DB-backed service,
    # and raise this (or lower DB_POOL_MAX) before the total approaches 200.
    command: ["--max-connections=200"]
    mem_limit: 1536m
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      # Creates the app user 'shahid'@'%' with this password on first init (before init-db.sql runs,
      # which then grants it every per-service DB). Services + the healthcheck below connect as shahid.
      MYSQL_USER: shahid
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "3306:3306"
    networks: [myplus-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "shahid", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka-server:
    build: ./eureka-server
    container_name: myplus-eureka
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -Xss512k"
    ports:
      - "8761:8761"
    networks: [myplus-net]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  config-server:
    build: ./config-server
    container_name: myplus-config
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    ports:
      - "8888:8888"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -Xss512k"
      EUREKA_URI: http://eureka-server:8761/eureka
    networks: [myplus-net]
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: myplus-redis
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    expose:
      - "6379"
    networks: [myplus-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api-gateway:
    build: ./api-gateway
    container_name: myplus-gateway
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    ports:
      - "8765:8765"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -Xss512k"
      EUREKA_URI: http://eureka-server:8761/eureka
      CONFIG_URI: http://config-server:8888
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      REDIS_HOST: redis           # spring.data.redis.host — demo-quota counter (slice 19)
    networks: [myplus-net]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8765/actuator/health/readiness"]
    depends_on:
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy

  auth-service:
    build: ./auth-service
    container_name: myplus-auth
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    expose:
      - "8081"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/actuator/health/readiness"]
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -Xss512k"
      <<: *db-env
      EUREKA_URI: http://eureka-server:8761/eureka
      CONFIG_URI: http://config-server:8888
      JWT_SECRET: ${JWT_SECRET}
      # Public base URL used to build the emailed verification/reset links. MUST be reachable from the
      # customer's browser (behind nginx: https://<your-domain>, which proxies /api/ -> gateway -> auth).
      # Unset here it would default to http://localhost:8765 and every link would be dead.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8765}
      RESET_PASSWORD_URL: ${RESET_PASSWORD_URL:-http://localhost:8080/user/changePassword}
      # SMTP itself lives in notification-service now; auth only composes the message and delegates.
      #
      # Bootstrap seeding — OFF unless you opt in. The application defaults are `true` (convenient in an IDE),
      # and this compose file is used for BOTH the local run and the VPS deploy, so leaving them unset shipped
      # a set of KNOWN-PASSWORD accounts straight to production: admin@myplus.com, ten demo.* users, and
      # owner.business@myplus.com — which carries ROLE_OWNER + SUPER_PRIVILEGE with no write cap — plus the
      # multi-location test team (admin.store@, cashier.a/b@, owner.education@, teacher.a/b@). All share
      # ${APP_DEMO_PASSWORD}, whose default is committed to this repo. Safe default here, opt in for local dev:
      #   echo "APP_SEED_DEMO=true"          >> .env   # local only — NEVER on the VPS
      #   echo "APP_SEED_TEST_FIXTURES=true" >> .env   # local only — the Cypress login ladder
      APP_SEED_ADMIN: ${APP_SEED_ADMIN:-false}
      APP_SEED_DEMO: ${APP_SEED_DEMO:-false}
      # owner./admin./user. privilege ladder + store/branch teams. Test scaffolding: auth-service refuses to
      # create these under the prod profile even if this is somehow true.
      APP_SEED_TEST_FIXTURES: ${APP_SEED_TEST_FIXTURES:-false}
      # No default any more. An unset password means seeding is SKIPPED rather than falling back to the
      # credential committed to this repo — that fallback was the actual exposure, not the flags.
      APP_DEMO_PASSWORD: ${APP_DEMO_PASSWORD:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
    networks: [myplus-net]
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy

  # Central email/SMS sender. auth-service (verification + password-reset), and any other service,
  # delegate delivery here over Eureka (http://notification-service/api/notifications). Without it
  # running, verification emails are silently dropped and new accounts can never be enabled.
  notification-service:
    build: ./notification-service
    container_name: myplus-notification
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    expose:
      - "8093"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8093/actuator/health/readiness"]
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -Xss512k"
      EUREKA_URI: http://eureka-server:8761/eureka
      CONFIG_URI: http://config-server:8888
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      # notification-service.yml reads MAIL_USER (full Gmail address) + MAIL_PASSWORD (app password).
      MAIL_USER: ${MAIL_USER:-maxtheservice@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    networks: [myplus-net]
    depends_on:
      config-server:
        condition: service_healthy

  inventory-service:
    build: ./inventory-service
    container_name: myplus-inventory
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    expose:
      - "8082"
