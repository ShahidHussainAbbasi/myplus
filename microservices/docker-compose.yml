# =============================================================================
# Phase 4 — network isolation + internal-secret enforcement.
#
# Only EDGE components publish host ports: mysql (3306, for the external monolith
# + migration), eureka (8761), config-server (8888) and the api-gateway (8765).
# The resource services and auth-service use `expose` only, so they are reachable
# ONLY from inside the private `myplus-net` network (i.e. via the gateway) and
# cannot be hit directly from the host to forge X-User-* headers.
#
# INTERNAL_SECRET is the shared gateway<->service trust token. The gateway stamps
# X-Internal-Secret; each service's HeaderAuthFilter rejects identity headers that
# don't carry it. Override per environment; the default below is for local stacks.
# NOTE: this stack assumes the monolith runs with auth.mode=server (calls flow
# through the gateway). Legacy direct calls would be rejected once enforced.
# =============================================================================
# Shared DB connection env for every DB-backed service. config-server serves
# spring.datasource.* built from these ${DB_HOST}/${DB_USER}/${DB_PASSWORD}
# placeholders, and Spring Cloud Config OVERRIDES container env by default — so
# THESE are the vars that actually take effect, not SPRING_DATASOURCE_*. Inside
# the network the DB host is the `mysql` service. `shahid` must exist in MySQL
# with CREATE DATABASE privilege (createDatabaseIfNotExist needs it for the
# catalog/finance/appointment DBs, which init-db.sql does not pre-create).
x-db-env: &db-env
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USER: shahid
  DB_PASSWORD: ${DB_PASSWORD}

# Shared log-rotation policy for EVERY container. Docker's default json-file driver never
# rotates, so container logs grow unbounded and fill the VPS disk (which then looks like the
# box running out of memory: MySQL can't write, JVMs OOM-adjacent failures, etc.). Capping at
# 3 × 10 MB = 30 MB per container bounds total log disk to ~0.6 GB across the 20 services and
# keeps `docker compose logs` working. Referenced by each service as `logging: *default-logging`.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    container_name: myplus-mysql
    restart: unless-stopped
    logging: *default-logging
    # Headroom above the combined service pools (11 services × 8 = 88) so admin/replication/spikes fit.
    command: ["--max-connections=200"]
    mem_limit: 1536m
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      # Creates the app user 'shahid'@'%' with this password on first init (before init-db.sql runs,
      # which then grants it every per-service DB). Services + the healthcheck below connect as shahid.
      MYSQL_USER: shahid
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "3306:3306"
    networks: [myplus-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "shahid", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka-server:
    build: ./eureka-server
    container_name: myplus-eureka
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -Xss512k"
    ports:
      - "8761:8761"
    networks: [myplus-net]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  config-server:
    build: ./config-server
    container_name: myplus-config
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    ports:
      - "8888:8888"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -Xss512k"
      EUREKA_URI: http://eureka-server:8761/eureka
    networks: [myplus-net]
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: myplus-redis
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    expose:
      - "6379"
    networks: [myplus-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api-gateway:
    build: ./api-gateway
    container_name: myplus-gateway
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    ports:
      - "8765:8765"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -Xss512k"
      EUREKA_URI: http://eureka-server:8761/eureka
      CONFIG_URI: http://config-server:8888
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      REDIS_HOST: redis           # spring.data.redis.host — demo-quota counter (slice 19)
    networks: [myplus-net]
    depends_on:
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy

  auth-service:
    build: ./auth-service
    container_name: myplus-auth
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    expose:
      - "8081"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -Xss512k"
      <<: *db-env
      EUREKA_URI: http://eureka-server:8761/eureka
      CONFIG_URI: http://config-server:8888
      JWT_SECRET: ${JWT_SECRET}
      # Public base URL used to build the emailed verification/reset links. MUST be reachable from the
      # customer's browser (behind nginx: https://<your-domain>, which proxies /api/ -> gateway -> auth).
      # Unset here it would default to http://localhost:8765 and every link would be dead.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8765}
      RESET_PASSWORD_URL: ${RESET_PASSWORD_URL:-http://localhost:8080/user/changePassword}
      # SMTP itself lives in notification-service now; auth only composes the message and delegates.
    networks: [myplus-net]
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy

  # Central email/SMS sender. auth-service (verification + password-reset), and any other service,
  # delegate delivery here over Eureka (http://notification-service/api/notifications). Without it
  # running, verification emails are silently dropped and new accounts can never be enabled.
  notification-service:
    build: ./notification-service
    container_name: myplus-notification
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    expose:
      - "8093"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -Xss512k"
      EUREKA_URI: http://eureka-server:8761/eureka
      CONFIG_URI: http://config-server:8888
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      # notification-service.yml reads MAIL_USER (full Gmail address) + MAIL_PASSWORD (app password).
      MAIL_USER: ${MAIL_USER:-maxtheservice@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    networks: [myplus-net]
    depends_on:
      config-server:
        condition: service_healthy

  inventory-service:
    build: ./inventory-service
    container_name: myplus-inventory
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    expose:
      - "8082"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -Xss512k"
      <<: *db-env
      EUREKA_URI: http://eureka-server:8761/eureka
      CONFIG_URI: http://config-server:8888
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    networks: [myplus-net]
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy

  catalog-service:
    build: ./catalog-service
    container_name: myplus-catalog
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    expose:
      - "8092"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -Xss512k"
      <<: *db-env
      EUREKA_URI: http://eureka-server:8761/eureka
