  education-service:
    build: ./education-service
    container_name: myplus-education
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    profiles: ["full"]
    expose:
      - "8084"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8084/actuator/health/readiness"]
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -Xss512k"
      <<: *db-env
      EUREKA_URI: http://eureka-server:8761/eureka
      CONFIG_URI: http://config-server:8888
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-maxtheservice}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
    networks: [myplus-net]
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      # Startup tier 3. Without this every vertical launched the moment config-server went healthy,
      # so 18 JVMs JIT-compiled at once and starved each other of CPU — that is why api-gateway took
      # 193s to answer its first probe and compose aborted. Waiting on the gateway splits the herd
      # into waves (core -> gateway -> verticals) and costs nothing: every request routes through the
      # gateway anyway, so a vertical that starts before it is up serves no one.
      api-gateway:
        condition: service_healthy

