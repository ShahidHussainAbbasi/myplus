server:
  port: 8098

spring:
  application:
    name: market-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/myplusdb_market?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=%2B05:00&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: false
    open-in-view: false
  flyway:
    # A new service: Flyway owns the schema from V1 on an empty database (STANDARDS D1). No baseline.
    baseline-on-migrate: false

# MP-0b — the organisation whose rows are the marketplace's own (policies, later canonical products, orders and
# the settlement ledger): the MaxTheService operator's org. Ruling R-2 in platform-marketplace-design.md.
market:
  platform-org-id: ${MARKET_PLATFORM_ORG_ID:1}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
