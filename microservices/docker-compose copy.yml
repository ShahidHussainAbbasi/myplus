services:
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: myplus-otel-lgtm
    ports:
      - "3000:3000"     # Grafana UI (admin/admin)
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    networks: [myplus-net]
    mem_limit: 1536m    # it bundles 4 backends â watch RAM

  api-gateway: { environment: &otel { JAVA_TOOL_OPTIONS: "-javaagent:/otel/opentelemetry-javaagent.jar -XX:MaxRAMPercentage=60.0 -Xss512k", OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-lgtm:4318", OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf", OTEL_LOGS_EXPORTER: "otlp", OTEL_METRICS_EXPORTER: "otlp", OTEL_TRACES_EXPORTER: "otlp", OTEL_SERVICE_NAME: "api-gateway", OTEL_RESOURCE_ATTRIBUTES: "service.namespace=myplus" }, volumes: ["./otel:/otel:ro"] }
  business-service:  { environment: { <<: *otel, OTEL_SERVICE_NAME: "business-service"  }, volumes: ["./otel:/otel:ro"] }
  inventory-service: { environment: { <<: *otel, OTEL_SERVICE_NAME: "inventory-service" }, volumes: ["./otel:/otel:ro"] }
  finance-service:   { environment: { <<: *otel, OTEL_SERVICE_NAME: "finance-service"   }, volumes: ["./otel:/otel:ro"] }