server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/myplusdb_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=%2B05:00&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: false
    open-in-view: false
  # Flyway: baseline the existing (ddl-auto-created) schema at V1 and skip it; a fresh DB runs
  # V1__baseline.sql. Local copy so it applies without a config-server rebuild.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:dev-only-insecure-change-me-jwt-secret-min-32-bytes-padding}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000

app:
  # C3c — auth-service is the OWNER of tenant capabilities (org.cap.*) and the tenant shape (org.shape).
  #
  # A capability is a property of the TENANT, and auth-service already owns the tenant: Organization carries
  # its type, plan, trial and entry cap, and all of those already reach every service as JWT claims.
  # Capabilities now take the same road, resolved once at token mint.
  #
  # This flag publishes the capability CATALOG here and ONLY here. The catalog is what SettingsService.set
  # validates against, so it is also what decides which service will ACCEPT a capability write — set it in a
  # second service and capability rows start landing in two stores again, which is the exact defect this
  # replaced (owner switches rxRequired off in business-service, pharma reads its own table, never refuses).
  capabilities:
    owner: true
  base-url: ${APP_BASE_URL:http://localhost:8765}
  verification-token-expiry-hours: 24
  password-reset-token-expiry-hours: 1
  # Bootstrap seeding — DEV defaults. Three independent concerns, because they carry different risk:
  #   seed-admin        the platform operator account
  #   seed-demo         PUBLIC DEMO tenants — a product feature (50-entry cap + "register at maxtheservice.com"
  #                     upsell), so it may legitimately run in prod, but only with an explicit password
  #   seed-test-fixtures  owner./admin./user. privilege ladder + store/branch teams — TEST SCAFFOLDING, never prod
  #
  # Passwords have NO default on purpose: under the prod profile SetupDataLoader skips any account whose password
  # was not explicitly supplied, rather than creating one with a published or blank credential. Locally the code
  # falls back to Demo@2025! / Admin@2025! so nothing needs configuring for dev or Cypress.
  #
  # Real customers are never seeded — they arrive via signup (/api/auth/register). See slice 32.
  seed-admin: ${APP_SEED_ADMIN:true}
  seed-demo: ${APP_SEED_DEMO:true}
  seed-test-fixtures: ${APP_SEED_TEST_FIXTURES:true}
  admin-password: ${APP_ADMIN_PASSWORD:}
  demo-password: ${APP_DEMO_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
